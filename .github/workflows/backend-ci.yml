name: Backend CI

on:
  pull_request:
    branches:
      - dev-parking
  push:
    branches:
      - dev-parking

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-smoke-tests:
    name: Build and Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DB_URL: jdbc:postgresql://localhost:5432/parking_ci_test
      DB_USERNAME: parking_ci
      DB_PASSWORD: parking_ci_password
      TEST_DB_URL: jdbc:postgresql://localhost:5432/parking_ci_test
      TEST_DB_USERNAME: parking_ci
      TEST_DB_PASSWORD: parking_ci_password

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: parking_ci_test
          POSTGRES_USER: parking_ci
          POSTGRES_PASSWORD: parking_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parking_ci -d parking_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: parking-backend

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Generate ephemeral JWT secrets
        shell: bash
        run: |
          jwt_secret="$(openssl rand -base64 32)"
          test_jwt_secret="$(openssl rand -base64 32)"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$test_jwt_secret"
          echo "JWT_SECRET_BASE64=$jwt_secret" >> "$GITHUB_ENV"
          echo "TEST_JWT_SECRET_BASE64=$test_jwt_secret" >> "$GITHUB_ENV"

      - name: Assemble backend and run smoke tests
        run: ./gradlew --no-daemon clean assemble smokeTest

      - name: Build production Docker image
        run: docker build --tag parking-backend:${{ github.sha }} .

      - name: Upload smoke test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-smoke-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            parking-backend/build/reports/tests/smokeTest
            parking-backend/build/test-results/smokeTest
          if-no-files-found: warn
          retention-days: 7
