name: Frontend CI

on:
  pull_request:
    branches:
      - dev-parking
  push:
    branches:
      - dev-parking

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Lint, Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      VITE_API_BASE_URL: https://parking-management-backend-erlan2332.onrender.com
      VITE_WS_URL: wss://parking-management-backend-erlan2332.onrender.com/ws/parking

    defaults:
      run:
        working-directory: parking-frontend

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: parking-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build production bundle
        run: npm run build
