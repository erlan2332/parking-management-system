spring:
  application:
    name: parking-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true

application:
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64:}
      issuer: parking-management-system
      access-token-ttl: PT1H
    cors:
      allowed-origins: ${PARKING_REST_ALLOWED_ORIGINS:http://localhost:5173}
  reservations:
    automation-delay: ${RESERVATION_AUTOMATION_DELAY:PT30S}
  realtime:
    websocket:
      allowed-origins: ${PARKING_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173}
  notifications:
    mail:
      enabled: ${MAIL_ENABLED:false}
      host: ${MAIL_HOST:}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      from: ${MAIL_FROM:}
      start-tls-enabled: ${MAIL_STARTTLS_ENABLED:false}
      connect-timeout: ${MAIL_CONNECT_TIMEOUT:PT5S}
      read-timeout: ${MAIL_READ_TIMEOUT:PT5S}
      write-timeout: ${MAIL_WRITE_TIMEOUT:PT5S}

parking:
  pricing:
    zone-id: ${PARKING_PRICING_ZONE_ID:Asia/Bishkek}
    day-start: "${PARKING_DAY_START:08:00}"
    day-end: "${PARKING_DAY_END:20:00}"
    day-rate-per-minute: ${PARKING_DAY_RATE_PER_MINUTE:2.00}
    night-rate-per-minute: ${PARKING_NIGHT_RATE_PER_MINUTE:1.00}
