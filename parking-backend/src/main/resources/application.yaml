spring:
  application:
    name: parking-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parking_db}
    username: ${DB_USERNAME:parking_user}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true

application:
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64:}
      issuer: parking-management-system
      access-token-ttl: PT1H
